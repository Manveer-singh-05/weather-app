<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Enhanced Weather App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 420px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h2 {
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 26px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
        }

        input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }

        button {
            padding: 0 25px;
            border: none;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(58, 123, 213, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(58, 123, 213, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        .weather-info {
            display: none;
            animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            margin-top: 25px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .weather-icon {
            width: 120px;
            height: 120px;
            margin: -10px auto 5px auto;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
        }

        .temp {
            font-size: 56px;
            font-weight: 600;
            margin: 5px 0;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .city-name {
            font-size: 26px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .condition {
            font-size: 20px;
            text-transform: capitalize;
            color: #e2e8f0;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 20px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .detail-item span {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-item strong {
            font-size: 18px;
            font-weight: 500;
        }

        .error {
            background: rgba(255, 75, 75, 0.2);
            color: #ff8a8a;
            border: 1px solid rgba(255, 75, 75, 0.3);
            padding: 12px;
            border-radius: 10px;
            font-weight: 500;
            margin-top: 15px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .loader {
            display: none;
            margin: 30px auto;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00d2ff;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .ai-summary {
            margin-top: 25px;
            font-size: 15px;
            line-height: 1.5;
            color: #f8fafc;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            padding: 15px;
            border-radius: 12px;
            display: none;
            border-left: 4px solid #00d2ff;
            text-align: left;
            position: relative;
        }

        .ai-summary::before {
            content: "✨ AI Insight";
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #00d2ff;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Weather Forecast</h2>
        <div class="search-box">
            <input type="text" id="city" placeholder="Enter city name..." onkeypress="handleKeyPress(event)"
                autocomplete="off" />
            <button onclick="getWeather()">Search</button>
        </div>

        <div class="loader" id="loader"></div>
        <div class="error" id="error-msg"></div>

        <div class="weather-info" id="weather-info">
            <h3 class="city-name" id="city-name">--</h3>
            <img src="" alt="Weather Icon" class="weather-icon" id="weather-icon" />
            <div class="temp" id="temp">--°C</div>
            <div class="condition" id="condition">--</div>

            <div class="details">
                <div class="detail-item">
                    <span>Humidity</span>
                    <strong id="humidity">--%</strong>
                </div>
                <div class="detail-item">
                    <span>Wind</span>
                    <strong id="wind">-- km/h</strong>
                </div>
                <div class="detail-item">
                    <span>Feels Like</span>
                    <strong id="feels-like">--°C</strong>
                </div>
            </div>
            <div class="ai-summary" id="ai-summary">
                <!-- Smart text generation based on weather data -->
            </div>
        </div>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                getWeather();
            }
        }

        // Simulating an AI Insight Generator based on accurate weather data rules
        function generateAISummary(data) {
            const temp = data.current.temp_c;
            const feelsLike = data.current.feelslike_c;
            const condition = data.current.condition.text.toLowerCase();
            const wind = data.current.wind_kph;
            const humidity = data.current.humidity;
            const isDay = data.current.is_day;

            let summary = [];

            // Temperature insights
            if (temp >= 30) {
                summary.push("It's quite hot out there. Make sure to stay hydrated and prioritize shade if you're going outside.");
            } else if (temp <= 5) {
                summary.push("Freezing temperatures right now! Bundle up with heavy winter layers.");
            } else if (temp < 15) {
                summary.push("It's a bit chilly. A warm jacket or sweater is highly recommended.");
            } else {
                summary.push("The temperature is quite comfortable right now.");
            }

            // Real feel vs Actual context
            if (feelsLike < temp - 3) {
                summary.push(`Factor in the wind chill – it actually feels closer to ${feelsLike}°C.`);
            } else if (feelsLike > temp + 3) {
                summary.push(`Note that the humidity makes it feel warmer, around ${feelsLike}°C.`);
            }

            // Condition specific insights
            if (condition.includes("rain") || condition.includes("drizzle") || condition.includes("shower")) {
                summary.push("Precipitation is expected, so don't forget your umbrella! ☂️");
            } else if (condition.includes("snow") || condition.includes("blizzard") || condition.includes("ice")) {
                summary.push("Snowy conditions ahead. Watch your step and drive carefully! ❄️");
            } else if (condition.includes("clear") || condition.includes("sunny")) {
                summary.push(isDay ? "Beautiful clear skies—a perfect day for outdoor activities! ☀️" : "It's a clear, beautiful night. 🌙");
            } else if (condition.includes("cloud") || condition.includes("overcast")) {
                summary.push("Skies are currently looking overcast.");
            }

            // Secondary effects
            if (wind > 25) {
                summary.push("It's also notably windy today! 💨");
            }
            if (humidity > 85 && temp > 20) {
                summary.push("High humidity levels might make it feel a bit muggy. 💧");
            }

            return summary.join(" ");
        }

        async function getWeather() {
            const cityInput = document.getElementById("city");
            const city = cityInput.value.trim();

            const errorMsg = document.getElementById("error-msg");
            const weatherInfo = document.getElementById("weather-info");
            const loader = document.getElementById("loader");
            const aiSummary = document.getElementById("ai-summary");

            // Reset states
            errorMsg.style.display = "none";
            weatherInfo.style.display = "none";
            aiSummary.style.display = "none";

            if (city === "") {
                errorMsg.innerHTML = "Please enter a valid city name first!";
                errorMsg.style.display = "block";
                return;
            }

            loader.style.display = "block";

            // Fixing potential error: using HTTPS, and properly URL-encoding the city name to avoid breaks
            // Kept the user's API key
            const apiUrl = `https://api.weatherapi.com/v1/current.json?key=2d7ff45f03ca40869de155210250911&q=${encodeURIComponent(city)}&aqi=yes`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                loader.style.display = "none";

                if (response.ok && !data.error) {
                    // Accurately format the location returning from API
                    document.getElementById("city-name").innerText = `${data.location.name}, ${data.location.country}`;
                    document.getElementById("temp").innerText = `${data.current.temp_c}°C`;
                    document.getElementById("condition").innerText = data.current.condition.text;
                    document.getElementById("humidity").innerText = `${data.current.humidity}%`;
                    document.getElementById("wind").innerText = `${data.current.wind_kph} km/h`;
                    document.getElementById("feels-like").innerText = `${data.current.feelslike_c}°C`;

                    // Secure icon URL
                    let iconUrl = data.current.condition.icon;
                    if (iconUrl.startsWith("//")) {
                        iconUrl = "https:" + iconUrl;
                    }
                    document.getElementById("weather-icon").src = iconUrl;

                    // Generate and show smart AI-like insight
                    aiSummary.innerText = generateAISummary(data);
                    aiSummary.style.display = "block";

                    // Reveal card info
                    weatherInfo.style.display = "block";
                } else {
                    // Fixing error state to pull accurate message from API
                    errorMsg.innerText = data.error?.message || "City not found. Please try another search.";
                    errorMsg.style.display = "block";
                }

            } catch (error) {
                // Network or CORS errors
                loader.style.display = "none";
                errorMsg.innerText = "Network error. Please check your internet connection and try again.";
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>

</html>
